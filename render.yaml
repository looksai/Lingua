# P1 staging blueprint. Not a deployment; connecting a Render account is a separate step.
# Free Render web services expose a public HTTPS address. Never use production data.
services:
  - type: web
    name: lingua-p1-staging
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm install --global pnpm@10.18.0 && pnpm install --no-prod --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24.22.3'
      # Staging MySQL only, with TLS verification implemented and tested before use.
      - key: DATABASE_URL
        sync: false
      # Base64 of the project CA certificate, entered only in Render secrets.
      # Mandatory for non-loopback MySQL; this value is never committed to Git.
      - key: DATABASE_SSL_CA_BASE64
        sync: false
      # Existing Manus WebDev authentication, NOT Manus Open App API OAuth:
      - key: MANUS_PROJECT_ID
        sync: false
      - key: MANUS_JWT_SECRET
        sync: false
      - key: MANUS_OAUTH_API_URL
        sync: false
      - key: MANUS_OAUTH_PORTAL_URL
        sync: false
      # The current WebDev login does not read OAUTH_CLIENT_ID,
      # OAUTH_CLIENT_SECRET or SESSION_SECRET. Those remain documented as
      # future options, not required launch-time secrets.
