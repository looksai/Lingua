name: Isolated Chromium QA (no student data)

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/qa/**'
      - 'tests/browser/**'
      - 'server/cal-browser-http-synthetic.test.ts'
      - 'server/cal-browser-full-tutorchat-http.test.ts'
      - 'client/src/lib/trpc.ts'
      - 'server/tutor-router.ts'
      - 'server/cal-catalog-runtime.ts'
      - 'server/auth-local.ts'
      - 'client/src/components/TutorChat.tsx'
      - 'client/src/lib/tutor-memory.ts'
      - 'client/src/lib/tutor-study-topic-bookmark.ts'
      - 'client/src/components/TutorCatalogTaskView.tsx'
      - 'client/src/components/TutorAudioControls.tsx'
      - 'shared/pedagogy/cal-client-delivery.ts'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-component-qa:
    name: Real Chromium component interaction (local only)
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest now uses 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Install frozen project dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright CLI (no package or lockfile edits)
        run: |
          mkdir -p /tmp/lingua-browser-tools
          npm install --prefix /tmp/lingua-browser-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium and system dependencies
        run: /tmp/lingua-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Run real browser-to-HTTP-to-CAL cases with synthetic signed accounts
        env:
          LINGUA_QA_PLAYWRIGHT_DIR: /tmp/lingua-browser-tools
          LINGUA_BROWSER_HTTP_QA: '1'
        run: pnpm exec vitest run server/cal-browser-http-synthetic.test.ts
      - name: Run full original TutorChat with real React Query, HTTP and signed synthetic JWT
        env:
          LINGUA_QA_PLAYWRIGHT_DIR: /tmp/lingua-browser-tools
          LINGUA_BROWSER_FULL_HTTP_QA: '1'
        run: pnpm exec vitest run server/cal-browser-full-tutorchat-http.test.ts
      - name: Run seven local-only browser interaction cases
        env:
          LINGUA_QA_PLAYWRIGHT_DIR: /tmp/lingua-browser-tools
        run: |
          set -euo pipefail
          pnpm exec vite --config tests/browser/vite.qa.config.ts --host 127.0.0.1 --port 4178 --strictPort > /tmp/lingua-browser-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          node tests/browser/run-browser-qa.mjs || {
            cat /tmp/lingua-browser-vite.log
            exit 1
          }

      - name: Run full TutorChat React in Chromium with mocked network hooks
        env:
          LINGUA_QA_PLAYWRIGHT_DIR: /tmp/lingua-browser-tools
        run: |
          set -euo pipefail
          pnpm exec vite --config tests/browser/vite.tutorchat.qa.config.ts --host 127.0.0.1 --port 4181 --strictPort > /tmp/lingua-full-tutorchat-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          node tests/browser/run-tutorchat-full-qa.mjs || {
            cat /tmp/lingua-full-tutorchat-vite.log
            exit 1
          }
