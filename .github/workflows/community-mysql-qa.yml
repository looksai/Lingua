name: Disposable community MySQL QA (no Aiven)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/community-router.ts'
      - 'server/partner-router.ts'
      - 'server/ads-router.ts'
      - 'drizzle/0010_partner_ads_DRAFT.sql'
      - 'drizzle/0009_portal_community_DRAFT.sql'
      - 'drizzle/schema.ts'
      - 'shared/portal-access.ts'
      - 'scripts/qa-portal-mysql.ts'
      - 'scripts/qa-migration-ledger.ts'
      - 'scripts/qa-disposable-backup-restore.sh'
      - 'tests/migration-ledger.test.ts'
      - 'drizzle/meta/_journal.json'
      - '.github/workflows/community-mysql-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-only-root
          MYSQL_DATABASE: lingua_portal_qa
          MYSQL_USER: lingua_qa
          MYSQL_PASSWORD: disposable-only-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pdisposable-only-root"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      LINGUA_PORTAL_MYSQL_QA: '1'
      LINGUA_PORTAL_COMMUNITY_ENABLED: 'true'
      LINGUA_PORTAL_PARTNER_CONTACT_ENABLED: 'true'
      LINGUA_PORTAL_ADS_ENABLED: 'true'
      DATABASE_URL: mysql://lingua_qa:disposable-only-pass@127.0.0.1:3306/lingua_portal_qa
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify migration ledger divergence is explicit (never connects to Aiven)
        run: pnpm exec tsx scripts/qa-migration-ledger.ts
      - name: Run migration and isolation assertions against disposable MySQL
        run: pnpm exec tsx scripts/qa-portal-mysql.ts
      - name: Rehearse AES256 encrypted backup and independent synthetic MySQL restore
        run: bash scripts/qa-disposable-backup-restore.sh
