name: Lingua Aiven auth 0003 (manual guarded)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect or apply 0003 local credentials migration"
        type: choice
        required: true
        default: inspect
        options: [inspect, migrate]
      confirmation:
        description: "For migrate only: APLICAR_0003_AUTH_LINGUA"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: lingua-aiven-staging
  cancel-in-progress: false
jobs:
  auth-0003:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Inspect or apply additive auth migration
        env:
          LINGUA_STAGING_ACTION: ${{ inputs.action }}
          LINGUA_STAGING_CONFIRMATION: ${{ inputs.confirmation }}
          LINGUA_STAGING_DATABASE_URL: ${{ secrets.LINGUA_STAGING_DATABASE_URL }}
          LINGUA_STAGING_CA_BASE64: ${{ secrets.LINGUA_STAGING_CA_BASE64 }}
        run: pnpm exec tsx scripts/staging-auth-0003.ts
