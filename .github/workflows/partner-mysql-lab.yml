name: Partner MySQL laboratory
on:
  pull_request:
    branches: [main]
    paths:
      - 'drizzle/partner-foundation-draft.ts'
      - 'drizzle/academy-budget-draft.ts'
      - 'server/academy-budget-repository.ts'
      - 'tests/academy-budget-mysql-lab.ts'
      - 'drizzle/schema.ts'
      - 'drizzle/exam-history-draft.ts'
      - 'server/exam-history-repository.ts'
      - 'shared/exam-history-contract.ts'
      - 'tests/exam-history-mysql-lab.ts'
      - 'drizzle.partner-lab.config.ts'
      - 'tests/partner-mysql-lab.mjs'
      - 'tests/academy-mysql-http-lab.ts'
      - 'server/academy-admission.ts'
      - 'server/auth-local.ts'
      - 'server/onboarding-router.ts'
      - 'server/learner-memory.ts'
      - 'server/db.ts'
      - 'tests/partner-invite-transaction-lab.ts'
      - 'server/partner-*.ts'
      - 'server/routers.ts'
      - 'server/_core/**'
      - 'client/src/App.tsx'
      - 'client/src/pages/PublicLive*'
      - 'client/src/pages/public-live-*'
      - 'tests/public-live-full-stack*'
      - '.github/workflows/partner-mysql-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lab_root_only
          MYSQL_DATABASE: partner_lab
          MYSQL_USER: partner_lab
          MYSQL_PASSWORD: partner_lab
        ports:
          - 33316:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit generate --config=drizzle.partner-lab.config.ts
      - run: pnpm exec drizzle-kit migrate --config=drizzle.partner-lab.config.ts
      - name: Durable exam history (disposable MySQL)
        env:
          ACADEMY_MYSQL_LAB: '1'
          DATABASE_URL: mysql://partner_lab:partner_lab@127.0.0.1:33316/partner_lab
          NODE_ENV: development
        run: pnpm exec tsx tests/exam-history-mysql-lab.ts
      - name: Durable Academy quota (disposable MySQL)
        env:
          ACADEMY_MYSQL_LAB: '1'
          DATABASE_URL: mysql://partner_lab:partner_lab@127.0.0.1:33316/partner_lab
          NODE_ENV: development
        run: pnpm exec tsx tests/academy-budget-mysql-lab.ts
      - run: node tests/partner-mysql-lab.mjs
      - run: pnpm exec tsx tests/partner-invite-transaction-lab.ts
      - name: Academy learner admission and isolation (disposable MySQL)
        env:
          ACADEMY_MYSQL_LAB: '1'
          DATABASE_URL: mysql://partner_lab:partner_lab@127.0.0.1:33316/partner_lab
          NODE_ENV: development
        run: pnpm exec tsx tests/academy-mysql-http-lab.ts
      - run: npm install --prefix /tmp/partner-browser playwright
      - run: /tmp/partner-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Full-stack public invite
        env:
          DATABASE_URL: mysql://partner_lab:partner_lab@127.0.0.1:33316/partner_lab
          NODE_ENV: development
          PARTNER_INVITES_ENABLED: 'true'
          VITE_PUBLIC_LIVES_ENABLED: 'true'
          PORT: '4173'
        run: |
          set -euo pipefail
          export LAB_INVITE_TOKEN="$(pnpm exec tsx tests/public-live-full-stack-seed.ts)"
          echo "::add-mask::$LAB_INVITE_TOKEN"
          pnpm exec tsx server/_core/index.ts > /tmp/partner-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/api/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/api/health >/dev/null
          cp tests/public-live-full-stack.mjs /tmp/partner-browser/test.mjs
          node /tmp/partner-browser/test.mjs
