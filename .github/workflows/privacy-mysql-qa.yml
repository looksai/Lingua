name: Disposable MySQL privacy migration QA (no Aiven)
on:
  pull_request:
    branches: [main]
    paths:
      - 'drizzle/0008_privacy_preferences_DRAFT.sql'
      - 'drizzle/schema.ts'
      - 'server/privacy-preferences.ts'
      - 'server/learner-memory.ts'
      - 'server/auth-local.ts'
      - 'scripts/qa-privacy-mysql.ts'
      - '.github/workflows/privacy-mysql-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-only
          MYSQL_DATABASE: lingua_privacy_qa
          MYSQL_USER: lingua_qa
          MYSQL_PASSWORD: disposable-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pdisposable-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      LINGUA_MYSQL_PRIVACY_QA: '1'
      DATABASE_URL: mysql://lingua_qa:disposable-password@127.0.0.1:3306/lingua_privacy_qa
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Install Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run privacy migration against disposable MySQL and test real application functions
        run: pnpm exec tsx scripts/qa-privacy-mysql.ts
